# reference: https://taplo.tamasfe.dev/configuration/formatter-options.html
[formatting]
# Indent nested table headers
indent_tables = true

# Use tab for each indentation level
indent_string = "\t"

# Avoid extra alignment spaces around =
align_entries = false

# Allow one blank line between blocks
allowed_blank_lines = 1

# Preserve the original key order
reorder_keys = false

# End the file with a newline
trailing_newline = true
