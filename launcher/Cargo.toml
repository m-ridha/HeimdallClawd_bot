[package]
name = "heimdall-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
toml = "1.1"
libc = "0.2"
base64 = "0.23"
bytes = "1"
http-body-util = "0.1"
hmac = "0.13"
sha2 = "0.11"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
	"blocking",
	"json",
	"multipart",
	"rustls-tls",
] }

[dev-dependencies]
tempfile = "3"
