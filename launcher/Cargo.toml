[package]
name = "heimdall-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
toml = "1.1"
libc = "0.2"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = [
	"blocking",
	"json",
	"multipart",
	"rustls-tls",
] }

[dev-dependencies]
tempfile = "3"
