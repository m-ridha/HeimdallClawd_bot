# See the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/launcher"
      - "/executor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore: [deps]"

  - package-ecosystem: "docker"
    directories:
      - "/executor"
      - "/deploy/bot"
      - "/deploy/executor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore: [docker]"

  - package-ecosystem: "pip"
    directory: "/.railway"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore: [deps]"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore: [ci]"
