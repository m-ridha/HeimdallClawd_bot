name: Release to Railway

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.release.tag_name }}
      release_tag: ${{ github.event.release.tag_name }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Python IaC SDK
        run: |
          python -m pip install -r .railway/requirements.txt
          python -B -m unittest discover -s tools/tests -v
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.68.0
      - name: Deploy agent and verify health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_AGENT_SERVICE_ID: ${{ vars.RAILWAY_AGENT_SERVICE_ID }}
        run: |
          : "${RAILWAY_TOKEN:?Missing production secret RAILWAY_TOKEN}"
          : "${RAILWAY_PROJECT_ID:?Missing production variable RAILWAY_PROJECT_ID}"
          : "${RAILWAY_ENVIRONMENT_ID:?Missing production variable RAILWAY_ENVIRONMENT_ID}"
          : "${RAILWAY_AGENT_SERVICE_ID:?Missing production variable RAILWAY_AGENT_SERVICE_ID}"
          # IDs are configuration, but should not appear in public deployment logs.
          for name in RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_AGENT_SERVICE_ID; do
            printf '::add-mask::%s\n' "${!name}"
          done
          python3 tools/verify-railway-token.py
          # RAILWAY_TOKEN supplies the project/environment; link queries account workspaces.
          railway config plan --file .railway/railway.py --out "$RUNNER_TEMP/railway-plan.json"
          railway config apply --plan "$RUNNER_TEMP/railway-plan.json" --yes
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          mkdir bot
          tar -xzf "heimdallclawd-$RELEASE_TAG.tar.gz" -C bot
          cd "$GITHUB_WORKSPACE"
          python3 tools/deploy-release.py "$RUNNER_TEMP/release/bot" "$RAILWAY_AGENT_SERVICE_ID" "$RELEASE_TAG"

  attach-assets:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release
      - name: Attach verified deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" "release/heimdallclawd-$RELEASE_TAG.tar.gz" release/SHA256SUMS --clobber
