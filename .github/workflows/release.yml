name: Release to Railway

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Expected a stable release tag vX.Y.Z'; exit 1;
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Check release deployment safeguards
        run: python3 -B -m unittest discover -s tools/tests -v
      - uses: docker/setup-buildx-action@v4
      - name: Select repository-scoped build cache
        shell: bash
        run: echo "BUILD_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}/build-cache" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and test native Linux runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/bot/Dockerfile
          target: release-binaries
          outputs: type=local,dest=${{ runner.temp }}/runtime
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}:runtime
          cache-to: type=registry,ref=${{ env.BUILD_CACHE }}:runtime,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Package and verify deployable bot
        run: |
          python3 tools/package-release.py "$RUNNER_TEMP/runtime/zeroclaw" "$RUNNER_TEMP/runtime/heimdall-launcher" "$RUNNER_TEMP/runtime/heimdall-executor" "$RUNNER_TEMP/bot" "$RELEASE_TAG" "$(git rev-parse HEAD)"
          docker build --tag heimdall-executor "$RUNNER_TEMP/bot/executor"
          docker build --file "$RUNNER_TEMP/bot/Dockerfile" --tag heimdall-bot "$RUNNER_TEMP/bot"
          tar -czf "$RUNNER_TEMP/heimdallclawd-$RELEASE_TAG.tar.gz" -C "$RUNNER_TEMP/bot" .
          sha256sum "$RUNNER_TEMP/heimdallclawd-$RELEASE_TAG.tar.gz" | sed "s|$RUNNER_TEMP/||" > "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            ${{ runner.temp }}/heimdallclawd-*.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.68.0
      - name: Deploy executor then bot and verify both
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_AGENT_SERVICE_ID: ${{ vars.RAILWAY_AGENT_SERVICE_ID }}
          RAILWAY_EXECUTOR_SERVICE_ID: ${{ vars.RAILWAY_EXECUTOR_SERVICE_ID }}
        run: |
          : "${RAILWAY_TOKEN:?Missing production secret RAILWAY_TOKEN}"
          : "${RAILWAY_PROJECT_ID:?Missing production variable RAILWAY_PROJECT_ID}"
          : "${RAILWAY_ENVIRONMENT_ID:?Missing production variable RAILWAY_ENVIRONMENT_ID}"
          : "${RAILWAY_AGENT_SERVICE_ID:?Missing production variable RAILWAY_AGENT_SERVICE_ID}"
          : "${RAILWAY_EXECUTOR_SERVICE_ID:?Missing production variable RAILWAY_EXECUTOR_SERVICE_ID}"
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          mkdir bot
          tar -xzf "heimdallclawd-$RELEASE_TAG.tar.gz" -C bot
          cd "$GITHUB_WORKSPACE"
          python3 tools/deploy-release.py "$RUNNER_TEMP/release/bot/executor" "$RAILWAY_EXECUTOR_SERVICE_ID" "$RELEASE_TAG"
          python3 tools/deploy-release.py "$RUNNER_TEMP/release/bot" "$RAILWAY_AGENT_SERVICE_ID" "$RELEASE_TAG"

  attach-assets:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release
      - name: Attach verified deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" "release/heimdallclawd-$RELEASE_TAG.tar.gz" release/SHA256SUMS --clobber
