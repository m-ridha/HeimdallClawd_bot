schema_version = 3
[gateway]
host = "0.0.0.0"
port = 3888
require_pairing = true
allow_public_bind = true
allow_remote_admin = false
[providers.models.openai.codex]
model = "gpt-6.1-sol"
wire_api = "responses"
requires_openai_auth = true
[providers.models.openrouter.free]
model = "openrouter/free"
wire_api = "chat_completions"
[[model_routes]]
hint = "free"
model_provider = "openrouter.free"
model = "openrouter/free"
[[model_routes]]
hint = "codex"
model_provider = "openai.codex"
model = "gpt-6.1-sol"
[agents.primary]
enabled = true
channels = ["telegram.home"]
model_provider = "openai.codex"
risk_profile = "primary"
runtime_profile = "primary"
mcp_bundles = ["workspace"]
skill_bundles = []
cron_jobs = []
[agents.primary.workspace]
path = "/data/zeroclaw/agents/primary/workspace"
[agents.primary.memory]
backend = "sqlite"
[channels]
session_persistence = true
session_backend = "sqlite"
[channels.telegram.home]
enabled = true
mention_only = true
ack_reactions = false
[peer_groups.telegram_home]
channel = "telegram.home"
agents = ["primary"]
external_peers = []
[risk_profiles.primary]
level = "supervised"
workspace_only = true
allowed_commands = []
allowed_tools = ["workspace__bash", "workspace__file_read", "workspace__file_write"]
auto_approve = ["workspace__bash", "workspace__file_read", "workspace__file_write"]
excluded_tools = ["shell", "file_read", "file_write", "git_operations", "cron_add", "cron_update", "schedule", "delegate"]
delegation_policy = { mode = "forbidden" }
shell_env_passthrough = []
sandbox_enabled = false
sandbox_backend = "none"
[runtime_profiles.primary]
agentic = true
max_tool_iterations = 24
max_actions_per_hour = 120
max_context_tokens = 32000
parallel_tools = false
max_tool_result_chars = 70000
[mcp]
enabled = true
deferred_loading = false
[[mcp.servers]]
name = "workspace"
transport = "http"
url = "http://heimdall-executor.railway.internal:3889/mcp"
tool_timeout_secs = 35
max_response_bytes = 524288
[mcp_bundles.workspace]
servers = ["workspace"]
[heartbeat]
enabled = false
[hooks]
enabled = false
[plugins]
enabled = false
auto_discover = false
[skills]
open_skills_enabled = false
[observability]
log_persistence = "none"
log_tool_io = "off"
log_llm_request_payload = "off"
